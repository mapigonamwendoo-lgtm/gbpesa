<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GB Pesa</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #0b7a4b;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
    }

    header p {
      margin-top: 8px;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      text-align: center;
    }

    .card h2 {
      margin-bottom: 10px;
    }

    .btn {
      display: inline-block;
      background: #0b7a4b;
      color: white;
      padding: 13px 25px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 15px;
    }

    .packages {
      display: grid;
      gap: 12px;
      margin-top: 15px;
    }

    .package {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>GB Pesa</h1>
    <p>Nunua na simamia vifurushi vyako vya GB</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>Karibu GB Pesa</h2>
      <p>Jukwaa lako la kusimamia vifurushi vya data.</p>

      <a href="#" class="btn">Jisajili / Ingia</a>
    </div>

    <div class="card">
      <h2>Vifurushi vya GB</h2>

      <div class="packages">

        <div class="package">
          <h3>GB 1</h3>
          <p>TSh 1,000</p>
          <a href="#" class="btn">Nunua</a>
        </div>

        <div class="package">
          <h3>GB 5</h3>
          <p>TSh 4,500</p>
          <a href="#" class="btn">Nunua</a>
        </div>

        <div class="package">
          <h3>GB 10</h3>
          <p>TSh 8,000</p>
          <a href="#" class="btn">Nunua</a>
        </div>

      </div>
    </div>

  </div>

  <footer>
    © 2026 GB Pesa
  </footer>

</body>
  </html>
