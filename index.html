<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GB Pesa</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
    }

    header {
      background: #087f4e;
      color: white;
      text-align: center;
      padding: 25px;
    }

    .container {
      max-width: 450px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #087f4e;
      color: white;
      font-size: 16px;
    }

    button.secondary {
      background: #555;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>GB Pesa</h1>
  <p>Nunua na simamia GB zako</p>
</header>

<div class="container">

  <div class="card">
    <h2>Jisajili</h2>

    <input id="signupName" type="text" placeholder="Jina lako">
    <input id="signupPhone" type="tel" placeholder="Namba ya simu">
    <input id="signupEmail" type="email" placeholder="Email">
    <input id="signupPassword" type="password" placeholder="Password">

    <button onclick="signUp()">Jisajili</button>
  </div>

  <div class="card">
    <h2>Ingia</h2>

    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">

    <button onclick="login()">Ingia</button>
  </div>

  <div id="message"></div>

</div>

<script>

const SUPABASE_URL = "https://zkyojgwsbvqkykbdzyjl.supabase.co";
*/
const SUPABASE_KEY = "sb_publishable_26cjrYRbIqXCNjusTbnF_Q__jEIJkrO";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

async function signUp() {

  const name =
    document.getElementById("signupName").value;

  const phone =
    document.getElementById("signupPhone").value;

  const email =
    document.getElementById("signupEmail").value;

  const password =
    document.getElementById("signupPassword").value;

  if (!email || !password) {
    showMessage("Weka email na password.");
    return;
  }

  const { data, error } =
    await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

  if (error) {
    showMessage(error.message);
    return;
  }

  if (data.user) {

    const { error: profileError } =
      await supabaseClient
        .from("profiles")
        .insert({
          id: data.user.id,
          full_name: name,
          phone: phone,
          referral_code:
            "GBP" +
            data.user.id
              .replaceAll("-", "")
              .substring(0, 8)
              .toUpperCase()
        });

    if (profileError) {
      showMessage(
        "Account imetengenezwa lakini profile haikuweza kuhifadhiwa."
      );
      return;
    }
  }

  showMessage(
    "Usajili umefanikiwa! Sasa unaweza kuingia."
  );
}

async function login() {

  const email =
    document.getElementById("loginEmail").value;

  const password =
    document.getElementById("loginPassword").value;

  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {
    showMessage(error.message);
    return;
  }

  showMessage("Umeingia kikamilifu!");
}

function showMessage(text) {
  document.getElementById("message").innerText = text;
}

</script>

</body>
      </html>
